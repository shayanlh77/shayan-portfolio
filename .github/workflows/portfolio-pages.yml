name: Publish portfolio access preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Copy the exact public portfolio release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { dirname, join } from 'node:path';

          const origin = 'https://08143875.shayan-lalooha.pages.dev/';
          const entries = (await readFile('release.sha256', 'utf8')).trim().split('\n');
          if (entries.length !== 155) throw new Error('Unexpected release file count.');
          const root = '_site';
          let next = 0;

          async function download() {
            while (next < entries.length) {
              const line = entries[next++];
              const [, hash, file] = /^([a-f0-9]{64})  ([A-Za-z0-9_.-]+(?:\/[A-Za-z0-9_.-]+)*)$/.exec(line) ?? [];
              if (!file || file.split('/').some(part => part.startsWith('.'))) throw new Error('Invalid release path.');
              const url = new URL(file, origin);
              let bytes;
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const response = await fetch(url, { signal: AbortSignal.timeout(60000) });
                  if (!response.ok || new URL(response.url).origin !== new URL(origin).origin) {
                    throw new Error('Unexpected response: ' + response.status);
                  }
                  bytes = Buffer.from(await response.arrayBuffer());
                  break;
                } catch (error) {
                  if (attempt === 3) throw new Error(file + ': ' + error.message);
                }
              }
              if (createHash('sha256').update(bytes).digest('hex') !== hash) throw new Error('Checksum mismatch: ' + file);
              const output = join(root, file);
              await mkdir(dirname(output), { recursive: true });
              if (file.endsWith('.html')) {
                const markup = bytes.toString('utf8');
                if (!/<head(?:\s[^>]*)?>/i.test(markup)) throw new Error('Missing head: ' + file);
                bytes = markup.replace(/<head(?:\s[^>]*)?>/i, '$&<meta name="robots" content="noindex">');
              }
              await writeFile(output, bytes);
            }
          }

          await Promise.all(Array.from({ length: 6 }, download));
          await writeFile(join(root, '.nojekyll'), '');
          console.log('All 155 release files passed checksum verification.');
          NODE
      - name: Publish and verify original videos in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='portfolio-videos-08143875'
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'Portfolio preview videos' --notes 'Original video files for the portfolio access preview.'
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/portfolio-release.json"
          mapfile -t missing < <(node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const { assets } = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/portfolio-release.json', 'utf8'));
          const uploaded = new Set(assets.filter(asset => asset.state === 'uploaded').map(asset => asset.name));
          const manifest = (await readFile('release.sha256', 'utf8')).trim().split('\n');
          for (const entry of manifest) {
            const match = /^\w{64}  (assets\/portfolio\/([a-z0-9-]+\.mp4))$/.exec(entry);
            if (match && !uploaded.has(match[2])) console.log('_site/' + match[1]);
          }
          NODE
          )
          if (( ${#missing[@]} )); then
            gh release upload "$tag" "${missing[@]}"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/portfolio-release.json"
          node --input-type=module <<'NODE'
          import { readdir, readFile, unlink, writeFile } from 'node:fs/promises';
          const { assets } = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/portfolio-release.json', 'utf8'));
          const uploaded = new Map(assets.map(asset => [asset.name, asset]));
          const manifest = (await readFile('release.sha256', 'utf8')).trim().split('\n');
          const links = new Map();
          for (const entry of manifest) {
            const match = /^([a-f0-9]{64})  (assets\/portfolio\/([a-z0-9-]+\.mp4))$/.exec(entry);
            if (!match) continue;
            const [, hash, path, name] = match;
            const asset = uploaded.get(name);
            if (asset?.state !== 'uploaded' || asset.digest !== 'sha256:' + hash) {
              throw new Error('Release video checksum mismatch: ' + name);
            }
            links.set(path, asset.browser_download_url);
          }
          if (links.size !== 45) throw new Error('Expected 45 original release videos.');
          for (const name of await readdir('_site')) {
            if (!name.endsWith('.html')) continue;
            const file = '_site/' + name;
            const original = await readFile(file, 'utf8');
            const updated = original.replace(/assets\/portfolio\/[a-z0-9-]+\.mp4/g, path => {
              if (!links.has(path)) throw new Error('Unknown video reference: ' + path);
              return links.get(path);
            });
            if (updated !== original) await writeFile(file, updated);
          }
          await Promise.all([...links.keys()].map(path => unlink('_site/' + path)));
          console.log('All 45 original video checksums verified in GitHub Releases.');
          NODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
